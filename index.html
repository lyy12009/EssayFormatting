<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排版預覽與樣式格式細節產生器</title>
    <style>
        /* 基礎設定：使用現代感字體與柔和漸層背景 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 卡片容器：讓內容集中且有層次感 */
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        /* 標題樣式 */
        h2 {
            color: #333333;
            margin-bottom: 2rem;
            font-size: 1.75rem;
            letter-spacing: 1px;
        }

        /* 按鈕群組區塊 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1.25rem; /* 按鈕之間的間距 */
        }

        /* 將原本的超連結美化為按鈕樣式 */
        .btn {
            display: block;
            padding: 0.85rem 1.5rem;
            color: #ffffff;
            background-color: #4a90e2;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.2);
        }

        /* 滑鼠懸停（Hover）時的動畫效果 */
        .btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(53, 122, 189, 0.3);
        }

        /* 點擊（Active）時的效果 */
        .btn:active {
            transform: translateY(0);
        }

        /* 第二個按鈕使用不同的顏色做視覺區隔 */
        .btn-secondary {
            background-color: #34495e;
            box-shadow: 0 4px 6px rgba(52, 73, 94, 0.2);
        }

        .btn-secondary:hover {
            background-color: #2c3e50;
            box-shadow: 0 6px 12px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>排版預覽與合約產生器</h2>
        
        <div class="button-group">
            <a href="Css.html" target="_blank" class="btn">
                排版格式預覽產生器 (一)
            </a>
            <a href="index2.html" target="_blank" class="btn btn-secondary">
                排版格式預覽產生器 (二)
            </a>
        </div>
    </div>

</body>
</html>
